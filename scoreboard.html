<style>
  :root{
    --bg-deep:#0E3B42;
    --bg-deeper:#0A4952;
    --bg-deep-soft:#14727C;
    --mint:#00FFD1;
    --mint-dim:#00E0B8;
    --mint-soft:rgba(0,255,209,0.18);
    --paper:#FAFFFB;
    --paper-card:#FFFFFF;
    --ink:#0A2A2F;
    --ink-soft:#4C6B70;
    --line-dark:rgba(255,255,255,0.16);
    --line-light:rgba(10,42,47,0.10);
    --shadow: 0 18px 40px rgba(6,88,96,0.22);
    --coral:#FF6B6B;
    --sun:#FFB020;
    --nav-h: 64px;
  }

  *{box-sizing:border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;}
  html{scroll-behavior:smooth;}
  html,body{height:100%; overflow:hidden;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    min-height:100dvh;
  }
  img{max-width:100%;display:block;}

  h1,h2,h3,h4,.display{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    letter-spacing:0.01em;
    margin:0;
  }

  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;}

  .site-nav{
    position:sticky;
    top:0;
    z-index:50;
    background:var(--bg-deeper);
    border-bottom:1px solid var(--line-dark);
    transition: transform 0.3s ease, opacity 0.3s ease;
  }

  @media (max-width: 768px) {
    body.match-active .site-nav {
      display: none;
    }
  }

  .nav-inner{
    max-width:1180px;
    margin:0 auto;
    padding:16px 28px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    gap:20px;
  }
  .nav-logo{
    position:absolute;
    left:28px;
    display:flex;
    align-items:baseline;
    gap:2px;
    color:var(--mint);
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:1.3rem;
    letter-spacing:0.01em;
    text-decoration:none;
  }
  .nav-logo span.sub{color:#fff;}
  .nav-tabs{
    display:flex;
    gap:6px;
    background:rgba(255,255,255,0.05);
    padding:5px;
    border-radius:999px;
    border:1px solid var(--line-dark);
  }
  .nav-tab{
    appearance:none;
    border:none;
    background:transparent;
    color:rgba(255,255,255,0.7);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:0.88rem;
    padding:9px 18px;
    border-radius:999px;
    cursor:pointer;
    transition:background 0.25s ease, color 0.25s ease;
    white-space:nowrap;
    text-decoration:none;
    display:inline-block;
  }
  .nav-tab.active{
    background:var(--mint);
    color:var(--bg-deeper);
  }
  .nav-tab:not(.active):hover{color:#fff;}

  @media (max-width:720px){
    .nav-inner{
      flex-wrap:wrap;
      padding:12px 16px;
      gap:10px;
      justify-content:center;
    }
    .nav-logo{
      position:static;
      font-size:1.1rem;
      margin-bottom:4px;
    }
    .nav-tabs{
      flex-basis:100%;
      width:100%;
      overflow-x:auto;
      scrollbar-width:none;
      justify-content:center;
    }
    .nav-tabs::-webkit-scrollbar{display:none;}
    .nav-tab{
      font-size:0.74rem;
      padding:7px 12px;
    }
  }

  #scoreboard.tab-panel.active{
    display:flex;
    flex-direction:column;
    min-height:0;
    flex:1 1 auto;
  }
  .scoreboard-frame-wrap{
    flex:1;
    min-height:0;
    background:var(--bg-deeper);
    display: flex;
    flex-direction: column;
  }

  #pcApp{
    --bg-deep:#0E3B42;
    --bg-deeper:#082A30;
    --bg-card:#123F47;
    --p1:#00F0C8;
    --p1-dim:#00B89C;
    --p2:#FFB020;
    --p2-dim:#D9930E;
    --ink:#F3FAF9;
    --ink-dim:rgba(243,250,249,0.62);
    --ink-faint:rgba(243,250,249,0.4);
    --line:rgba(255,255,255,0.14);
    --danger:#FF6B6B;
    --safe-t:env(safe-area-inset-top, 0px);
    --safe-b:env(safe-area-inset-bottom, 0px);
    --safe-l:env(safe-area-inset-left, 0px);
    --safe-r:env(safe-area-inset-right, 0px);
  }
  button{font-family:inherit; cursor:pointer;}
  input{font-family:inherit; -webkit-user-select: text; user-select: text;}

  #pcApp{
    position:relative;
    height:100%;
    width:100%;
    overflow:hidden;
    background:var(--bg-deeper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-tap-highlight-color:transparent;
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
  }

  .screen{display:none; height:100%; width:100%; flex-direction:column;}
  .screen.active{display:flex;}

  #screen-setup{
    background:
      radial-gradient(circle at 85% -10%, rgba(0,240,200,0.14), transparent 45%),
      var(--bg-deep);
    overflow-y:auto;
    align-items:center;
    padding: calc(48px + var(--safe-t)) 20px calc(48px + var(--safe-b));
  }
  .pc-setup-card{
    width:100%;
    max-width:420px;
    text-align:center;
  }
  .pc-title{
    font-size:clamp(2.4rem, 9vw, 3.2rem);
    color:var(--p1);
    text-transform:uppercase;
    letter-spacing:0.01em;
    line-height:1;
    margin-top:4px;
  }
  .tagline{
    color:var(--ink-dim);
    font-size:0.95rem;
    margin:10px 0 34px;
  }

  .pc-field-block{margin-bottom:22px; text-align:left;}
  .pc-field-block > label{
    display:block;
    font-family:'JetBrains Mono',monospace;
    font-size:0.7rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-bottom:8px;
  }
  .name-input{
    width:100%;
    padding:14px 16px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:rgba(255,255,255,0.05);
    color:var(--ink);
    font-size:1rem;
    outline:none;
    transition:border-color 0.2s ease;
  }
  .name-input:focus{border-color:var(--p1);}
  .name-input::placeholder{color:var(--ink-faint);}

  .segmented{
    display:flex;
    gap:6px;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--line);
    border-radius:12px;
    padding:5px;
  }
  .segmented button{
    flex:1;
    background:transparent;
    border:none;
    color:var(--ink-dim);
    font-weight:700;
    font-size:0.88rem;
    padding:11px 8px;
    border-radius:9px;
    transition:background 0.2s ease, color 0.2s ease;
  }
  .segmented button.active{
    background:var(--p1);
    color:var(--bg-deeper);
  }

  .btn-start{
    width:100%;
    background:var(--p1);
    color:var(--bg-deeper);
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:1.05rem;
    padding:17px;
    border-radius:14px;
    box-shadow:0 14px 30px rgba(0,240,200,0.22);
    margin-top:10px;
  }

  #screen-match{ background:var(--bg-deeper); position:relative; }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding: calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));
    flex:0 0 auto;
    z-index:20;
    background:var(--bg-deeper);
  }
  .topbar-left{display:flex; gap:8px; flex:0 0 auto;}
  .topbar-right{display:flex; gap:8px; flex:0 0 auto;}
  .icon-btn{
    width:38px; height:38px;
    border-radius:50%;
    border:1.5px solid var(--line);
    background:rgba(255,255,255,0.04);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-size:1.05rem;
    flex:0 0 auto;
  }
  .icon-btn:active{background:rgba(255,255,255,0.1);}
  .icon-btn.muted svg path { opacity: 0.4; }
  .icon-btn.muted { border-color: rgba(255,255,255,0.08); color: var(--ink-faint); }

  .topbar-center{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    min-width:0;
  }
  
  .game-label{
    font-family:'JetBrains Mono',monospace;
    font-size:clamp(2.47rem, 6.75vw, 3.6rem);
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin:0;
    line-height:1.2;
  }
  .tally-row{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:clamp(3.375rem, 9vw, 5.4rem);
    margin:2px 0 0 0;
    line-height:1.2;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .tally-row .tp1{color:var(--p1);}
  .tally-row .tp2{color:var(--p2);}
  .tally-row .tsep{color:var(--ink-faint); margin:0 8px;}

  .court{
    flex:1 1 auto;
    display:flex;
    flex-direction:row;
    min-height:0;
    position:relative;
  }
  
  @media (orientation:portrait) and (hover:none) and (pointer:coarse){
    .court{flex-direction:column;}
  }

  @media (max-width: 950px) and (orientation: landscape) {
    .court {
      flex-direction: row !important;
    }
    .topbar {
      padding-top: 2px;
      padding-bottom: 2px;
    }
    .game-label {
      font-size: 1.1rem !important;
    }
    .tally-row {
      font-size: 1.6rem !important;
    }
    .player-name {
      font-size: clamp(0.9rem, 3.5vw, 1.4rem) !important;
    }
    .score-digit {
      font-size: clamp(45px, 16vh, 100px) !important;
    }
    .half {
      padding: 4px 8px calc(4px + var(--safe-b)) !important;
    }
    .bottom-dock {
      padding: 2px 12px calc(4px + var(--safe-b)) !important;
    }
    .net-bar {
      width: 3px !important;
      height: auto !important;
      background: repeating-linear-gradient(45deg, rgba(255,255,255,0.18) 0 4px, transparent 4px 9px) !important;
    }
  }

  .half{
    flex:1 1 0;
    min-width:0; min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
    padding: 10px 14px calc(10px + var(--safe-b));
    outline:none;
    overflow:hidden;
    cursor:pointer;
  }
  .half:active {
    background: rgba(255,255,255,0.03);
  }
  .half-p1{padding-left: calc(14px + var(--safe-l));}
  .half-p2{padding-right: calc(14px + var(--safe-r));}
  @media (orientation:portrait) and (hover:none) and (pointer:coarse){
    .half-p1{padding-left:14px;}
    .half-p2{padding-right:14px;}
  }

  .name-row{
    flex:0 0 auto;
    display:flex; align-items:center; gap:12px;
    padding-top:4px;
  }
  .serve-dot{
    width:14px; height:14px; border-radius:50%;
    background:currentColor;
    opacity:0.15;
    transition:opacity 0.2s ease;
  }
  .serve-dot.active{opacity:1; box-shadow:0 0 12px currentColor;}
  .player-name{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    text-transform:uppercase;
    font-size:clamp(1.666rem, 5.88vw, 2.254rem);
    letter-spacing:0.02em;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    line-height:1.1;
  }
  .half-p1 .player-name, .half-p1 .serve-dot{color:var(--p1);}
  .half-p2 .player-name, .half-p2 .serve-dot{color:var(--p2);}

  .score-wrapper{
    flex:1;
    min-height:0;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .score-digit{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:clamp(80px, 28vw, 210px);
    line-height:1;
    color:var(--ink);
  }

  .games-label{
    flex:0 0 auto;
    font-family:'JetBrains Mono',monospace;
    font-size:0.72rem;
    letter-spacing:0.1em;
    color:var(--ink-dim);
    margin-bottom:2px;
  }
  .tap-hint{
    flex:0 0 auto;
    font-size:0.72rem;
    color:var(--ink-faint);
  }

  .net-bar{
    flex:0 0 auto;
    width:3px;
    background:repeating-linear-gradient(45deg, rgba(255,255,255,0.18) 0 4px, transparent 4px 9px);
    position:relative;
  }
  @media (orientation:portrait) and (hover:none) and (pointer:coarse){
    .net-bar{width:100%; height:3px;
      background:repeating-linear-gradient(-45deg, rgba(255,255,255,0.18) 0 4px, transparent 4px 9px);
    }
  }

  .bottom-dock{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 8px calc(16px + var(--safe-r)) calc(14px + var(--safe-b)) calc(16px + var(--safe-l));
    background:var(--bg-deeper);
    border-top:1px solid var(--line);
    z-index:20;
  }
  .dock-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
  }
  .dock-btn{
    width:46px; height:46px;
    border-radius:50%;
    border:1.5px solid var(--line);
    background:rgba(255,255,255,0.04);
    color:var(--ink);
    font-size:1.15rem;
    display:flex; align-items:center; justify-content:center;
  }
  .dock-btn:disabled{opacity:0.3;}

  .overlay{
    position:fixed; inset:0;
    background:rgba(5,20,23,0.86);
    backdrop-filter:blur(3px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:24px;
  }
  .overlay.show{display:flex;}
  .overlay-card{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:22px;
    padding:34px 28px;
    max-width:420px;
    width:100%;
    text-align:center;
  }
  .overlay-eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:0.72rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--p1);
    margin-bottom:10px;
    display:block;
  }
  .overlay-card h2{font-size:1.6rem; color:var(--ink); margin-bottom:10px;}
  .overlay-card .final-score{
    font-family:'JetBrains Mono',monospace;
    font-size:2.2rem;
    font-weight:700;
    color:var(--p1);
    margin:14px 0;
  }
  .overlay-btn{
    width:100%;
    background:var(--p1);
    color:var(--bg-deeper);
    border:none;
    font-weight:700;
    font-size:1rem;
    padding:15px;
    border-radius:12px;
    margin-top:18px;
  }
</style>

<body>

<nav class="site-nav">
  <div class="nav-inner">
    <a class="nav-logo" href="/">PONG<span class="sub">·HOME</span></a>
    <div class="nav-tabs" role="tablist">
      <a class="nav-tab" href="/">Home</a>
      <a class="nav-tab" href="/tournament">Arena</a>
      <a class="nav-tab active" href="/scoreboard" aria-current="page">Scoreboard</a>
    </div>
  </div>
</nav>

<div class="scoreboard-frame-wrap">
<div id="pcApp">

  <!-- ================= SETUP SCREEN ================= -->
  <section id="screen-setup" class="screen active">
    <div class="pc-setup-card">
      <h1 class="pc-title">Scoreboard</h1>
      <p class="tagline">Call the score. It keeps the count.</p>

      <div class="pc-field-block">
        <label for="p1NameInput">Player 1</label>
        <input type="text" id="p1NameInput" class="name-input" maxlength="16" placeholder="Vince">
      </div>
      <div class="pc-field-block">
        <label for="p2NameInput">Player 2</label>
        <input type="text" id="p2NameInput" class="name-input" maxlength="16" placeholder="John">
      </div>

      <div class="pc-field-block">
        <label>Match Format</label>
        <div class="segmented" id="formatSeg">
          <button type="button" data-value="1">Bo1</button>
          <button type="button" data-value="3" class="active">Bo3</button>
          <button type="button" data-value="5">Bo5</button>
          <button type="button" data-value="7">Bo7</button>
        </div>
      </div>

      <div class="pc-field-block">
        <label>Points to Win</label>
        <div class="segmented" id="targetSeg">
          <button type="button" data-value="11" class="active">11</button>
          <button type="button" data-value="21">21</button>
        </div>
      </div>

      <button type="button" id="startMatchBtn" class="btn-start">Start Match</button>
    </div>
  </section>

  <!-- ================= MATCH SCREEN ================= -->
  <section id="screen-match" class="screen">
    <div class="topbar">
      <div class="topbar-left">
        <button type="button" class="icon-btn" id="resetBtn" aria-label="Reset match">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"></path><polyline points="21 3 21 9 15 9"></polyline></svg>
        </button>
      </div>

      <div class="topbar-center">
        <div class="game-label" id="gameLabel">BO3 · GAME 1</div>
        <div class="tally-row"><span class="tp1" id="tallyP1">0</span><span class="tsep">—</span><span class="tp2" id="tallyP2">0</span></div>
      </div>
      
      <div class="topbar-right">
        <button type="button" class="icon-btn" id="muteBtn" aria-label="Toggle voice announcements">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
        </button>
      </div>
    </div>

    <div class="court" id="court">
      <div class="half half-p1" id="halfP1" role="button" aria-label="Add point Player 1">
        <div class="name-row"><span class="serve-dot" id="serveDotP1"></span><span class="player-name" id="nameP1"></span></div>
        <div class="score-wrapper"><div class="score-digit" id="scoreP1">0</div></div>
        <div class="games-label">GAMES <span id="gamesP1">0</span></div>
        <div class="tap-hint">Tap to score</div>
      </div>

      <div class="net-bar"></div>

      <div class="half half-p2" id="halfP2" role="button" aria-label="Add point Player 2">
        <div class="name-row"><span class="serve-dot" id="serveDotP2"></span><span class="player-name" id="nameP2"></span></div>
        <div class="score-wrapper"><div class="score-digit" id="scoreP2">0</div></div>
        <div class="games-label">GAMES <span id="gamesP2">0</span></div>
        <div class="tap-hint">Tap to score</div>
      </div>
    </div>

    <div class="bottom-dock">
      <div class="dock-controls">
        <button type="button" class="dock-btn" id="undoBtn" disabled aria-label="Undo last point">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 14 4 9 9 4"></polyline><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- ================= OVERLAYS ================= -->
  <div class="overlay" id="overlayGameComplete">
    <div class="overlay-card">
      <span class="overlay-eyebrow">Game complete</span>
      <h2 id="gcWinnerName">—</h2>
      <div class="final-score" id="gcFinalScore">0 – 0</div>
      <button type="button" class="overlay-btn" id="gcNextGameBtn">Next Game</button>
    </div>
  </div>

  <div class="overlay" id="overlayMatchComplete">
    <div class="overlay-card">
      <span class="overlay-eyebrow">🏆 Match complete</span>
      <h2 id="mcWinnerName">—</h2>
      <div class="final-score" id="mcFinalTally">0 – 0</div>
      <button type="button" class="overlay-btn" id="mcNewMatchBtn">New Match</button>
    </div>
  </div>

</div>
</div>

<script>
(function(){
  'use strict';

  let state = {
    players: ['Player 1', 'Player 2'],
    target: 11,
    formatGames: 3,
    gamesNeeded: 2,
    currentGame: { score: [0, 0], firstServer: 0 },
    completedGames: [],
    gamesWon: [0, 0],
    matchComplete: false,
    matchWinner: null
  };

  let historyStack = [];
  let isMuted = false;

  const p1NameInput = document.getElementById('p1NameInput');
  const p2NameInput = document.getElementById('p2NameInput');
  const startMatchBtn = document.getElementById('startMatchBtn');
  const screenSetup = document.getElementById('screen-setup');
  const screenMatch = document.getElementById('screen-match');

  const scoreP1 = document.getElementById('scoreP1');
  const scoreP2 = document.getElementById('scoreP2');
  const nameP1 = document.getElementById('nameP1');
  const nameP2 = document.getElementById('nameP2');
  const gamesP1 = document.getElementById('gamesP1');
  const gamesP2 = document.getElementById('gamesP2');
  const tallyP1 = document.getElementById('tallyP1');
  const tallyP2 = document.getElementById('tallyP2');
  const gameLabel = document.getElementById('gameLabel');
  const undoBtn = document.getElementById('undoBtn');
  const muteBtn = document.getElementById('muteBtn');

  const halfP1 = document.getElementById('halfP1');
  const halfP2 = document.getElementById('halfP2');
  const resetBtn = document.getElementById('resetBtn');

  const overlayGameComplete = document.getElementById('overlayGameComplete');
  const gcWinnerName = document.getElementById('gcWinnerName');
  const gcFinalScore = document.getElementById('gcFinalScore');
  const gcNextGameBtn = document.getElementById('gcNextGameBtn');

  const overlayMatchComplete = document.getElementById('overlayMatchComplete');
  const mcWinnerName = document.getElementById('mcWinnerName');
  const mcFinalTally = document.getElementById('mcFinalTally');
  const mcNewMatchBtn = document.getElementById('mcNewMatchBtn');

  function unlockAudio() {
    if ('speechSynthesis' in window) {
      try {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance('');
        utterance.volume = 0;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.error("Audio unlock error:", e);
      }
    }
  }

  function speakScore(serverIdx, receiverIdx) {
    if (isMuted || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();

    const sScore = state.currentGame.score[serverIdx];
    const rScore = state.currentGame.score[receiverIdx];
    
    let textToSpeak = `${sScore}, ${rScore}`;

    const utterance = new SpeechSynthesisUtterance(textToSpeak);
    utterance.rate = 1.0;
    utterance.pitch = 1.0;
    window.speechSynthesis.speak(utterance);
  }

  document.querySelectorAll('#formatSeg button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#formatSeg button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.formatGames = parseInt(btn.dataset.value, 10);
      state.gamesNeeded = Math.ceil(state.formatGames / 2);
    });
  });

  document.querySelectorAll('#targetSeg button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#targetSeg button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.target = parseInt(btn.dataset.value, 10);
    });
  });

  startMatchBtn.addEventListener('click', () => {
    unlockAudio();
    state.players[0] = p1NameInput.value.trim() || p1NameInput.placeholder || 'Player 1';
    state.players[1] = p2NameInput.value.trim() || p2NameInput.placeholder || 'Player 2';
    screenSetup.classList.remove('active');
    screenMatch.classList.add('active');
    document.body.classList.add('match-active');
    updateUI();
  });

  muteBtn.addEventListener('click', () => {
    isMuted = !isMuted;
    muteBtn.classList.toggle('muted', isMuted);
    if (isMuted && 'speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
  });

  function computeServer(a, b, target, firstServer){
    const deuceThreshold = target - 1;
    const p = a + b;
    if (!(a >= deuceThreshold && b >= deuceThreshold)) {
      return (Math.floor(p / 2) % 2 === 0) ? firstServer : 1 - firstServer;
    }
    const deuceStartP = 2 * deuceThreshold;
    const serverAtDeuce = (Math.floor(deuceStartP / 2) % 2 === 0) ? firstServer : 1 - firstServer;
    return ((p - deuceStartP) % 2 === 0) ? serverAtDeuce : 1 - serverAtDeuce;
  }

  function addPoint(playerIndex) {
    if (state.matchComplete) return;

    historyStack.push(JSON.parse(JSON.stringify(state)));
    undoBtn.disabled = false;

    state.currentGame.score[playerIndex]++;
    const s1 = state.currentGame.score[0];
    const s2 = state.currentGame.score[1];

    const currentServer = computeServer(s1, s2, state.target, state.currentGame.firstServer);
    speakScore(currentServer, 1 - currentServer);

    const wonGame = (state.currentGame.score[playerIndex] >= state.target) && (Math.abs(s1 - s2) >= 2);
    if (wonGame) {
      state.completedGames.push({ score: [s1, s2], winner: playerIndex });
      state.gamesWon[playerIndex]++;

      if (state.gamesWon[playerIndex] >= state.gamesNeeded) {
        state.matchComplete = true;
        mcWinnerName.textContent = state.players[playerIndex] + " Wins the Match!";
        mcFinalTally.textContent = `${state.gamesWon[0]} — ${state.gamesWon[1]}`;
        overlayMatchComplete.classList.add('show');
      } else {
        gcWinnerName.textContent = state.players[playerIndex] + " Wins Game " + state.completedGames.length;
        gcFinalScore.textContent = `${s1} — ${s2}`;
        overlayGameComplete.classList.add('show');
      }
    }

    updateUI();
  }

  function undoPoint() {
    if (historyStack.length === 0) return;
    state = historyStack.pop();
    if (historyStack.length === 0) undoBtn.disabled = true;
    overlayGameComplete.classList.remove('show');
    overlayMatchComplete.classList.remove('show');
    updateUI();
  }

  function nextGame() {
    overlayGameComplete.classList.remove('show');
    const newFirstServer = 1 - state.currentGame.firstServer;
    state.currentGame = { score: [0, 0], firstServer: newFirstServer };
    updateUI();
  }

  function resetMatch() {
    state.currentGame = { score: [0, 0], firstServer: 0 };
    state.completedGames = [];
    state.gamesWon = [0, 0];
    state.matchComplete = false;
    state.matchWinner = null;
    historyStack = [];
    undoBtn.disabled = true;
    overlayGameComplete.classList.remove('show');
    overlayMatchComplete.classList.remove('show');
    screenMatch.classList.remove('active');
    screenSetup.classList.add('active');
    document.body.classList.remove('match-active');
  }

  function updateUI() {
    nameP1.textContent = state.players[0];
    nameP2.textContent = state.players[1];

    scoreP1.textContent = state.currentGame.score[0];
    scoreP2.textContent = state.currentGame.score[1];
    gamesP1.textContent = state.gamesWon[0];
    gamesP2.textContent = state.gamesWon[1];
    tallyP1.textContent = state.gamesWon[0];
    tallyP2.textContent = state.gamesWon[1];

    gameLabel.textContent = `BO${state.formatGames} · GAME ${state.completedGames.length + 1}`;

    const server = computeServer(state.currentGame.score[0], state.currentGame.score[1], state.target, state.currentGame.firstServer);
    document.getElementById('serveDotP1').classList.toggle('active', server === 0);
    document.getElementById('serveDotP2').classList.toggle('active', server === 1);
  }

  window.addEventListener('keydown', (e) => {
    if (screenSetup.classList.contains('active')) {
      if (e.key === 'Enter') {
        startMatchBtn.click();
      }
      return;
    }

    if (e.key === 'ArrowLeft') {
      e.preventDefault();
      addPoint(0);
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      addPoint(1);
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      undoPoint();
    }
  });

  halfP1.addEventListener('pointerdown', (e) => { e.preventDefault(); addPoint(0); });
  halfP2.addEventListener('pointerdown', (e) => { e.preventDefault(); addPoint(1); });
  undoBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); undoPoint(); });
  resetBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); resetMatch(); });
  gcNextGameBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); nextGame(); });
  mcNewMatchBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); resetMatch(); });

})();
</script>
</body>
</html>
