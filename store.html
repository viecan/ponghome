<style>
  :root{
    --bg-deep:#0E3B42;
    --bg-deeper:#0A4952;
    --bg-deep-soft:#14727C;
    --mint:#00FFD1;
    --mint-dim:#00E0B8;
    --mint-soft:rgba(0,255,209,0.18);
    --paper:#FAFFFB;
    --paper-card:#FFFFFF;
    --ink:#0A2A2F;
    --ink-soft:#4C6B70;
    --line-dark:rgba(255,255,255,0.16);
    --line-light:rgba(10,42,47,0.10);
    --shadow: 0 18px 40px rgba(6,88,96,0.22);
    --coral:#FF6B6B;
    --sun:#FFB020;
    --nav-h: 64px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}

  h1,h2,h3,h4,.display{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    letter-spacing:0.01em;
    margin:0;
  }

  /* ============ TYPOGRAPHY: widow/orphan control ============
     Headings get balanced line-breaking so short titles never leave
     a single dangling word on the last line. Body copy gets "pretty"
     wrapping, which specifically avoids orphans at paragraph ends.
     Both degrade gracefully to normal wrapping on unsupported
     browsers; widows/orphans is included as a fallback signal. */
  h1,h2,h3,h4,
  .display,
  .section-title,
  .book-title,
  .book-sub,
  .ch-heading,
  .subsection,
  .city-head h3,
  .pc-title,
  .games-recap-title,
  .fo-title,
  .bracket-title,
  .bracket-section-heading,
  .hero-eyebrow,
  .eyebrow,
  .coach-cta-eyebrow,
  .overlay-eyebrow,
  .tagline{
    text-wrap:balance;
    widows:2;
    orphans:2;
  }

  p,
  li,
  .service-copy p,
  .chapter-body,
  .chapter-body p,
  .fo-desc,
  .sub{
    text-wrap:pretty;
    widows:2;
    orphans:2;
  }

  .mono{font-family:'JetBrains Mono',monospace;}

  a{color:inherit;}

  .dot{
    display:inline-block;
    width:0.32em;
    height:0.32em;
    border-radius:50%;
    background:var(--mint);
    vertical-align:middle;
    margin-left:0.12em;
  }

  /* ============ NAV ============ */
  .site-nav{
    position:sticky;
    top:0;
    z-index:50;
    background:var(--bg-deeper);
    border-bottom:1px solid var(--line-dark);
  }
  .nav-inner{
    max-width:1180px;
    margin:0 auto;
    padding:16px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
  }
  .nav-logo{
    display:flex;
    align-items:baseline;
    gap:2px;
    color:var(--mint);
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:1.3rem;
    letter-spacing:0.01em;
    text-decoration:none;
  }
  .nav-logo span.sub{
    color:#fff;
  }
  .nav-tabs{
    display:flex;
    gap:6px;
    background:rgba(255,255,255,0.05);
    padding:5px;
    border-radius:999px;
    border:1px solid var(--line-dark);
  }
  .nav-tab{
    appearance:none;
    border:none;
    background:transparent;
    color:rgba(255,255,255,0.7);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:0.88rem;
    padding:9px 18px;
    border-radius:999px;
    cursor:pointer;
    transition:background 0.25s ease, color 0.25s ease;
    white-space:nowrap;
    text-decoration:none;
    display:inline-block;
  }
  .nav-tab.active{
    background:var(--mint);
    color:var(--bg-deeper);
  }
  .nav-tab:not(.active):hover{
    color:#fff;
  }
  .nav-cta{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:transparent;
    color:var(--mint);
    border:1.5px solid var(--mint);
    padding:9px 16px;
    border-radius:999px;
    font-weight:600;
    font-size:0.85rem;
    text-decoration:none;
    white-space:nowrap;
    transition:background 0.25s ease, color 0.25s ease;
  }
  .nav-cta:hover{
    background:var(--mint);
    color:var(--bg-deeper);
  }

  .nav-right{
    display:flex;
    align-items:center;
    gap:12px;
  }

  /* social icon buttons — used to follow, not to book */
  .social-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .social-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:38px;
    height:38px;
    border-radius:50%;
    border:1.5px solid rgba(255,255,255,0.22);
    color:rgba(255,255,255,0.85);
    background:transparent;
    text-decoration:none;
    transition:border-color 0.2s ease, background 0.2s ease, color 0.2s ease, transform 0.2s ease;
  }
  .social-btn svg{width:17px;height:17px;fill:currentColor;}
  .social-btn:hover{
    border-color:var(--mint);
    background:var(--mint-soft);
    color:var(--mint);
    transform:translateY(-2px);
  }
  .social-btn.on-light{
    border-color:var(--line-light);
    color:var(--ink-soft);
  }
  .social-btn.on-light:hover{
    border-color:var(--mint-dim);
    background:var(--mint-soft);
    color:var(--mint-dim);
  }

  @media (max-width:720px){
    .nav-inner{
      flex-wrap:wrap;
      padding:12px 16px;
      gap:10px;
      justify-content:center;
    }
    .nav-logo{
      order:1;
      font-size:1.1rem;
    }
    .nav-right{
      order:2;
      gap:8px;
    }
    .social-btn{width:34px; height:34px;}
    .social-btn svg{width:15px; height:15px;}
    .nav-cta{display:none;}
    .nav-tabs{
      order:3;
      flex-basis:100%;
      width:100%;
      flex-wrap:nowrap;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      justify-content:center;
      gap:5px;
      background:transparent;
      border:none;
      padding:0;
      scrollbar-width:none;
    }
    .nav-tabs::-webkit-scrollbar{display:none;}
    .nav-tab{
      flex:0 0 auto;
      white-space:nowrap;
      font-size:0.74rem;
      padding:7px 12px;
      background:rgba(255,255,255,0.06);
      border:1px solid var(--line-dark);
    }
    .nav-tab.active{
      border-color:var(--mint);
    }
  }
  @media (max-width:380px){
    .nav-tab{font-size:0.68rem; padding:6px 10px;}
  }

  /* ============ TAB PANELS ============ */
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  /* ============ HERO ============ */
  .hero{
    background:
      radial-gradient(circle at 82% -10%, rgba(0,240,200,0.16), transparent 45%),
      var(--bg-deep);
    color:#fff;
    padding:20px 28px 90px;
    position:relative;
    overflow:hidden;
  }
  .hero-inner{
    max-width:900px;
    margin:0 auto;
    text-align:center;
  }
  .hero-eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:0.78rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--mint);
    background:var(--mint-soft);
    border:1px solid rgba(0,240,200,0.35);
    padding:7px 16px;
    border-radius:999px;
    margin-bottom:28px;
  }
  .hero h1{
    font-size:clamp(2rem, 5.2vw, 3.9rem);
    line-height:1.04;
    color:var(--mint);
    text-transform:uppercase;
    margin-top:24px;
  }
  @media (min-width:861px){
    .hero h1{
      font-size:clamp(1.8rem, 3.2vw, 2.7rem);
      white-space:nowrap;
    }
    .hero-break{display:none;}
  }
  .hero h1 .white{color:#fff;}
  .hero-ball-wrap{
    display:block;
    position:relative;
    width:24px;
    height:24px;
    margin:14px auto 0;
    z-index:2;
    pointer-events:none;
  }
  .hero-ball{
    position:relative;
    width:100%;
    height:100%;
    border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #ffffff, #eaf9f5 55%, #cfeee6 100%);
    box-shadow:0 0 24px rgba(0,240,200,0.45), 0 16px 28px rgba(0,0,0,0.35), inset -8px -8px 14px rgba(0,0,0,0.08);
    animation:heroBallFloat 4.4s ease-in-out infinite;
  }
  .hero-ball::after{
    content:"";
    position:absolute;
    inset:9%;
    border-radius:50%;
    border:1px solid rgba(0,240,200,0.25);
    opacity:0.6;
  }
  .hero-ball-shadow{
    position:absolute;
    left:50%;
    bottom:-6px;
    width:17px;
    height:4.5px;
    margin-left:-8.5px;
    border-radius:50%;
    background:rgba(0,0,0,0.35);
    filter:blur(3px);
    animation:heroBallShadow 4.4s ease-in-out infinite;
  }
  @media (min-width:861px){
    .hero-ball-wrap{
      width:32px;
      height:32px;
      margin:16px auto 0;
    }
    .hero-ball-shadow{
      width:23px;
      height:6px;
      margin-left:-11.5px;
      bottom:-7px;
    }
  }
  @keyframes heroBallFloat{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-24px) rotate(180deg); }
  }
  @keyframes heroBallShadow{
    0%,100%{ transform:scale(1); opacity:0.35; }
    50%{ transform:scale(0.7); opacity:0.16; }
  }
  .hero p.lead{
    max-width:560px;
    margin:26px auto 38px;
    font-size:1.08rem;
    line-height:1.65;
    color:rgba(255,255,255,0.78);
    text-align:justify;
    text-align-last:center;
  }
  @media (min-width:861px){
    .hero p.lead{
      max-width:800px;
    }
  }
  @media (max-width:720px){
    .hero p.lead{
      font-size:1.02rem;
    }
  }
  .btn-primary{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:var(--mint);
    color:var(--bg-deeper);
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:0.98rem;
    padding:16px 30px;
    border-radius:999px;
    text-decoration:none;
    box-shadow:0 14px 30px rgba(0,240,200,0.22);
    transition:transform 0.2s ease, box-shadow 0.2s ease;
  }
  .btn-primary:hover{
    transform:translateY(-2px);
    box-shadow:0 18px 34px rgba(0,240,200,0.32);
  }
  .btn-secondary{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:transparent;
    color:#fff;
    border:1.5px solid rgba(255,255,255,0.35);
    font-weight:600;
    font-size:0.95rem;
    padding:14px 26px;
    border-radius:999px;
    text-decoration:none;
    transition:border-color 0.2s ease, background 0.2s ease;
  }
  .btn-secondary:hover{
    border-color:var(--mint);
    background:rgba(0,240,200,0.08);
  }
  .hero-actions{
    display:flex;
    gap:14px;
    justify-content:center;
    flex-wrap:wrap;
  }

  /* rally dots divider — signature motif echoing the logo's dot */
  .rally-divider{
    width:100%;
    height:46px;
    margin:0 auto;
    display:block;
  }

  /* ============ SERVICE SECTION ============ */
  .section{
    padding:86px 28px;
  }
  .section-inner{
    max-width:1080px;
    margin:0 auto;
  }
  .section-light{background:var(--paper);}
  .section-deep{background:var(--bg-deep); color:#fff;}

  .kicker{
    font-family:'JetBrains Mono',monospace;
    font-size:0.76rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--mint-dim);
    margin-bottom:12px;
    display:block;
  }
  .section-deep .kicker{color:var(--mint);}

  .section-title{
    font-size:clamp(1.8rem, 3.4vw, 2.6rem);
    line-height:1.15;
    max-width:720px;
    margin-bottom:18px;
  }

  .service-grid{
    display:grid;
    grid-template-columns:minmax(0, 1.15fr) minmax(280px, 0.85fr);
    gap:clamp(28px, 3.2vw, 44px);
    align-items:start;
    margin-top:36px;
  }
  .service-copy{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .service-copy p{
    font-size:1.02rem;
    line-height:1.75;
    color:var(--ink-soft);
    margin:0;
  }
  .feature-list{
    list-style:none;
    padding:0;
    margin:12px 0 0;
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:14px 16px;
  }
  .feature-list li{
    display:flex;
    align-items:flex-start;
    gap:12px;
    font-size:0.95rem;
    line-height:1.5;
    background:rgba(14,59,66,0.03);
    border:1px solid rgba(10,42,47,0.06);
    border-radius:14px;
    padding:12px 14px;
    min-height:100%;
  }
  .feature-list .ico{
    flex:0 0 auto;
    width:30px;
    height:30px;
    border-radius:50%;
    background:var(--mint-soft);
    border:1px solid rgba(0,240,200,0.4);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .feature-list .ico .dot{margin:0;}

  .service-card{
    background:var(--bg-deep);
    border-radius:24px;
    padding:32px 28px;
    color:#fff;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
    align-self:start;
  }
  .service-card::after{
    content:"";
    position:absolute;
    right:-40px; bottom:-40px;
    width:180px; height:180px;
    border-radius:50%;
    border:2px dashed rgba(0,240,200,0.35);
  }
  .service-card h3{
    color:var(--mint);
    font-size:1.4rem;
    margin-bottom:14px;
  }
  .service-card p{
    color:rgba(255,255,255,0.75);
    font-size:0.96rem;
    line-height:1.6;
  }

  @media (max-width:860px){
    .service-grid{grid-template-columns:1fr;}
    .feature-list{grid-template-columns:1fr;}
  }

  /* ============ COACHES ============ */
  .city-group{margin-top:56px;}
  .city-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:24px;
  }
  .city-head h3{
    font-size:1.3rem;
    color:#fff;
  }
  .city-flag{font-size:1.3rem;}

  .coach-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:18px;
  }
  .coach-card{
    background:var(--bg-deep-soft);
    border:1px solid var(--line-dark);
    border-radius:20px;
    padding:24px;
    transition:transform 0.2s ease, border-color 0.2s ease;
  }
  .coach-card:hover{
    transform:translateY(-4px);
    border-color:var(--mint);
  }
  .coach-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    margin-bottom:14px;
  }
  .coach-name{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:1.15rem;
    color:#fff;
  }
  .coach-price{
    font-family:'JetBrains Mono',monospace;
    font-size:0.78rem;
    color:var(--bg-deeper);
    background:var(--mint);
    padding:4px 10px;
    border-radius:999px;
    white-space:nowrap;
    font-weight:600;
  }
  .coach-price.tbd{
    background:transparent;
    color:var(--mint);
    border:1px solid rgba(0,240,200,0.4);
  }
  .coach-role{
    font-size:0.87rem;
    line-height:1.55;
    color:rgba(255,255,255,0.68);
  }

  .coach-cta-card{
    background:linear-gradient(135deg, var(--mint) 0%, var(--mint-dim) 100%);
    border:1px solid transparent;
    border-radius:20px;
    padding:24px;
    display:flex;
    flex-direction:column;
    transition:transform 0.2s ease;
  }
  .coach-cta-card:hover{transform:translateY(-4px);}
  .coach-cta-eyebrow{
    display:inline-block;
    font-family:'JetBrains Mono',monospace;
    font-size:0.7rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--bg-deeper);
    opacity:0.72;
    margin-bottom:10px;
  }
  .coach-cta-quote{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:1.08rem;
    line-height:1.35;
    color:var(--bg-deeper);
    margin:0 0 18px;
    flex:1;
  }
  .coach-cta-btn{
    background:var(--bg-deeper);
    color:var(--mint);
    justify-content:center;
    width:100%;
  }
  .coach-cta-btn:hover{
    background:var(--bg-deep-soft);
  }

  /* ============ FOOTER CTA ============ */
  .footer-cta{
    background:var(--bg-deeper);
    color:#fff;
    padding:80px 28px;
    text-align:center;
  }
  .footer-cta h2{
    font-size:clamp(1.8rem,4vw,2.6rem);
    color:#fff;
    margin-bottom:16px;
  }
  .footer-cta h2 .dot{background:var(--mint);}
  .footer-cta p{
    color:rgba(255,255,255,0.65);
    max-width:480px;
    margin:0 auto 32px;
    font-size:1rem;
  }
  .site-footer{
    background:var(--bg-deeper);
    border-top:1px solid var(--line-dark);
    color:rgba(255,255,255,0.5);
    text-align:center;
    font-size:0.85rem;
    padding:22px;
  }
  .footer-follow{margin-left:6px;}
  .footer-desktop{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
  }
  .footer-mobile{display:none;}
  .footer-mobile .footer-follow-line{
    display:block;
    margin-top:6px;
  }
  @media (max-width:640px){
    .footer-desktop{display:none;}
    .footer-mobile{display:block;}
  }

  /* ============ CONTACT SECTION ============ */
  .contact-section{
    background:var(--paper);
    padding:80px 28px;
  }
  .contact-shell{
    max-width:1000px;
    margin:0 auto;
  }
  .contact-intro{
    max-width:520px;

  /* ============ PING PONG RALLY ANIMATION (Learn tab, before Chapter 1) ============ */
  .pc-anim-card{
    background:var(--paper-card);
    border:1px solid var(--line-light);
    border-radius:22px;
    padding:22px 22px 26px;
    margin-bottom:28px;
    box-shadow:0 4px 14px rgba(10,42,47,0.05);
  }
  .pc-table-scene{
    position:relative;
    height:200px;
    border-radius:16px;
    overflow:hidden;
    background:
      linear-gradient(180deg, rgba(0,240,200,0.08), transparent 45%),
      var(--bg-deep);
    border:1px solid rgba(0,240,200,0.18);
  }
  .pc-table-baseline{
    position:absolute;
    left:8%; right:8%; top:58%;
    height:1.5px;
    background:rgba(255,255,255,0.14);
    border-radius:2px;
  }
  .pc-net{
    position:absolute;
    left:50%; top:26%; bottom:36%;
    width:3px;
    transform:translateX(-50%);
    background:repeating-linear-gradient(180deg, rgba(0,240,200,0.55) 0 4px, transparent 4px 9px);
    border-radius:2px;
  }
  .pc-paddle{
    position:absolute;
    top:52%;
    width:26px; height:60px;
    margin-top:-42px;
    transform-origin:bottom center;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .pc-paddle-left{left:3%; animation:pcPaddleLeftHit 3.2s ease-in-out infinite;}
  .pc-paddle-right{right:3%; animation:pcPaddleRightHit 3.2s ease-in-out infinite;}
  .pc-paddle-blade{
    width:26px; height:34px;
    border-radius:50% 50% 46% 46% / 60% 60% 40% 40%;
  }
  .pc-paddle-left .pc-paddle-blade{background:var(--mint); box-shadow:0 0 14px rgba(0,240,200,0.4);}
  .pc-paddle-right .pc-paddle-blade{background:var(--p2, #FFB020); box-shadow:0 0 14px rgba(255,176,32,0.35);}
  .pc-paddle-handle{
    width:7px; height:20px;
    border-radius:4px;
    margin-top:1px;
  }
  .pc-paddle-left .pc-paddle-handle{background:var(--mint-dim);}
  .pc-paddle-right .pc-paddle-handle{background:var(--p2-dim, #D9930E);}

  .pc-ball-shadow{
    position:absolute;
    top:60%;
    width:16px; height:5px;
    margin-left:-8px;
    border-radius:50%;
    background:rgba(0,0,0,0.4);
    filter:blur(1px);
    animation:pcBallShadow 3.2s cubic-bezier(.45,.05,.55,.95) infinite;
  }
  .pc-ball{
    position:absolute;
    width:12px; height:12px;
    margin-left:-6px; margin-top:-6px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 8px rgba(255,255,255,0.75), 0 0 2px #fff;
    animation:pcBallFly 3.2s cubic-bezier(.45,.05,.55,.95) infinite;
  }

  @keyframes pcBallFly{
    0%   {left:6%;  top:52%; transform:scale(1);}
    9%   {left:16%; top:20%; transform:scale(1);}
    20%  {left:34%; top:8%;  transform:scale(1);}
    32%  {left:56%; top:26%; transform:scale(1);}
    38%  {left:66%; top:50%; transform:scale(1.15,0.8);}
    44%  {left:72%; top:32%; transform:scale(1);}
    50%  {left:94%; top:52%; transform:scale(1);}
    59%  {left:84%; top:20%; transform:scale(1);}
    70%  {left:66%; top:8%;  transform:scale(1);}
    82%  {left:44%; top:26%; transform:scale(1);}
    88%  {left:34%; top:50%; transform:scale(1.15,0.8);}
    94%  {left:28%; top:32%; transform:scale(1);}
    100% {left:6%;  top:52%; transform:scale(1);}
  }
  @keyframes pcBallShadow{
    0%   {left:6%;  opacity:0.32;}
    9%   {left:16%; opacity:0.14;}
    20%  {left:34%; opacity:0.05;}
    32%  {left:56%; opacity:0.14;}
    38%  {left:66%; opacity:0.36;}
    44%  {left:72%; opacity:0.18;}
    50%  {left:94%; opacity:0.32;}
    59%  {left:84%; opacity:0.14;}
    70%  {left:66%; opacity:0.05;}
    82%  {left:44%; opacity:0.14;}
    88%  {left:34%; opacity:0.36;}
    94%  {left:28%; opacity:0.18;}
    100% {left:6%;  opacity:0.32;}
  }
  @keyframes pcPaddleLeftHit{
    0%{transform:rotate(-18deg);}
    6%{transform:rotate(0deg);}
    94%{transform:rotate(0deg);}
    100%{transform:rotate(-18deg);}
  }
  @keyframes pcPaddleRightHit{
    0%,44%{transform:rotate(0deg);}
    50%{transform:rotate(18deg);}
    56%,100%{transform:rotate(0deg);}
  }

  .text-area{resize:vertical; min-height:88px; font-family:'Inter',sans-serif;}

  .field-block{margin-bottom:22px;}
  .field-row{display:flex; gap:10px;}
  .field-row .text-input{flex:1;}

  .btn-small{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--bg-deep);
    color:var(--mint);
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:0.85rem;
    padding:11px 18px;
    border-radius:10px;
    cursor:pointer;
    white-space:nowrap;
    transition:background 0.2s ease;
  }
  .btn-small:hover{background:var(--bg-deeper);}
  .btn-ghost{
    background:transparent;
    color:var(--ink-soft);
    border:1.5px solid var(--line-light);
  }
  .btn-ghost:hover{border-color:var(--mint-dim); color:var(--mint-dim); background:var(--mint-soft);}
  .btn-danger{
    background:transparent;
    color:#B44848;
    border:1.5px solid rgba(180,72,72,0.3);
  }
  .btn-danger:hover{background:rgba(180,72,72,0.08);}

  .format-options{
    display:grid;
    gap:12px;
  }
  .format-option{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:14px 16px;
    border:1.5px solid var(--line-light);
    border-radius:12px;
    cursor:pointer;
    transition:border-color 0.2s ease, background 0.2s ease;
  }
  .format-option:hover{border-color:var(--mint-dim);}
  .format-option.selected{
    border-color:var(--mint);
    background:var(--mint-soft);
  }
  .format-option input{accent-color:var(--mint); margin-top:3px;}
  .format-option .fo-title{font-weight:700; font-size:0.92rem; color:var(--ink); margin-bottom:3px;}
  .format-option .fo-desc{font-size:0.82rem; color:var(--ink-soft); line-height:1.5;}

  .player-list{
    list-style:none;
    margin:0;
    padding:0;
    display:grid;
    gap:8px;
    max-height:340px;
    overflow-y:auto;
  }
  .player-row{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--paper);
    border:1px solid var(--line-light);
    border-radius:10px;
    padding:9px 12px;
  }
  .player-row .p-seed{
    font-family:'JetBrains Mono',monospace;
    font-size:0.72rem;
    color:var(--mint-dim);
    width:22px;
    flex:0 0 auto;
  }
  .player-row .p-name{
    flex:1;
    font-size:0.9rem;
    color:var(--ink);
    border:none;
    background:transparent;
    outline:none;
    font-family:'Inter',sans-serif;
  }
  .player-row .p-remove{
    flex:0 0 auto;
    width:24px;height:24px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:1rem;
    line-height:1;
  }
  .player-row .p-remove:hover{color:#B44848;}
  .player-count{
    font-family:'JetBrains Mono',monospace;
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-top:12px;
  }

  .setup-actions{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:26px;
  }

  .generate-bar{
    text-align:center;
    margin-top:32px;
  }
  .btn-generate{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:var(--mint);
    color:var(--bg-deeper);
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:1rem;
    padding:16px 34px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    box-shadow:0 14px 30px rgba(0,240,200,0.22);
    transition:transform 0.2s ease, opacity 0.2s ease;
  }
  .btn-generate:hover{transform:translateY(-2px);}
  .btn-generate:disabled{opacity:0.4; cursor:not-allowed; transform:none;}
  .setup-hint{
    font-size:0.82rem;
    color:var(--ink-soft);
    margin-top:10px;
  }

  /* --- bracket toolbar --- */
  .bracket-toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:36px;
    padding-bottom:22px;
    border-bottom:1px solid var(--line-light);
  }
  .bracket-title h3{font-size:1.3rem; color:var(--ink); margin-bottom:4px;}
  .bracket-title .bracket-meta{
    font-family:'JetBrains Mono',monospace;
    font-size:0.75rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--mint-dim);
  }
  .bracket-actions{display:flex; gap:10px; flex-wrap:wrap;}

  /* --- champion banner --- */
  .champion-banner{
    position:relative;
    background:var(--bg-deep);
    color:#fff;
    border-radius:22px;
    padding:44px 30px;
    text-align:center;
    margin-bottom:40px;
    overflow:hidden;
  }
  .champion-banner .cb-eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:0.75rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--mint);
    margin-bottom:10px;
    display:block;
  }
  .champion-banner h3{
    font-size:clamp(1.7rem,4vw,2.4rem);
    color:#fff;
  }
  .champion-banner h3 .dot{background:var(--mint);}
  .confetti-piece{
    position:absolute;
    top:-12px;
    width:8px;height:14px;
    opacity:0.9;
    animation:confetti-fall linear forwards;
    border-radius:2px;
  }
  @keyframes confetti-fall{
    to{ transform:translateY(340px) rotate(600deg); opacity:0; }
  }

  /* --- bracket columns --- */
  .bracket-scroll{overflow-x:auto; padding-bottom:12px;}
  .bracket-columns{
    display:flex;
    gap:34px;
    min-width:max-content;
    padding:4px;
  }
  .bracket-col{
    display:flex;
    flex-direction:column;
    justify-content:space-around;
    gap:20px;
    min-width:230px;
  }
  .bracket-col-label{
    font-family:'JetBrains Mono',monospace;
    font-size:0.72rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    text-align:center;
    margin-bottom:6px;
  }

  .match-card{
    background:var(--paper-card);
    border:1.5px solid var(--line-light);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(10,42,47,0.04);
  }
  .match-card.match-live{border-color:var(--mint-dim);}
  .match-card.match-done{border-color:var(--line-light);}
  .match-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 12px;
    font-size:0.85rem;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  .match-row:first-child{border-bottom:1px solid var(--line-light);}
  .match-row:hover:not(.no-click){background:var(--mint-soft);}
  .match-row.winner-row{background:var(--mint-soft); font-weight:700; color:var(--ink);}
  .match-row.winner-row .mr-name::after{
    content:"✓";
    color:var(--mint-dim);
    margin-left:6px;
  }
  .match-row .mr-seed{
    font-family:'JetBrains Mono',monospace;
    font-size:0.68rem;
    color:var(--ink-soft);
    width:16px;
    flex:0 0 auto;
  }
  .match-row .mr-name{
    flex:1;
    color:var(--ink);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .match-row .mr-name.tbd{color:var(--ink-soft); font-style:italic;}
  .match-row .mr-name.bye{color:var(--ink-soft);}
  .match-row .mr-score{
    flex:0 0 auto;
    width:32px;
    text-align:center;
    font-family:'JetBrains Mono',monospace;
    font-size:0.78rem;
    color:var(--ink-soft);
  }
  .match-score-form{
    display:flex;
    align-items:center;
    gap:6px;
    padding:8px 12px;
    background:var(--paper);
    border-top:1px solid var(--line-light);
  }
  .match-score-form input{
    width:36px;
    text-align:center;
    font-family:'JetBrains Mono',monospace;
    font-size:0.82rem;
    padding:5px 2px;
    border-radius:6px;
    border:1px solid var(--line-light);
  }
  .match-score-form span{color:var(--ink-soft); font-size:0.78rem;}
  .match-score-form button{
    margin-left:auto;
    background:var(--bg-deep);
    color:var(--mint);
    border:none;
    padding:6px 12px;
    border-radius:8px;
    font-size:0.75rem;
    font-weight:600;
    cursor:pointer;
  }
  .match-label{
    text-align:center;
    font-family:'JetBrains Mono',monospace;
    font-size:0.65rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:4px;
  }

  .bracket-section-heading{
    display:flex;
    align-items:center;
    gap:10px;
    margin:44px 0 22px;
  }
  .bracket-section-heading h4{
    font-size:1rem;
    color:var(--ink);
  }
  .bracket-section-heading .bsh-tag{
    font-family:'JetBrains Mono',monospace;
    font-size:0.68rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--mint-dim);
    background:var(--mint-soft);
    border:1px solid rgba(0,240,200,0.35);
    padding:3px 10px;
    border-radius:999px;
  }

  /* --- round robin --- */
  .rr-layout{
    display:grid;
    grid-template-columns:1.2fr 1fr;
    gap:36px;
    align-items:start;
  }
  @media (max-width:900px){ .rr-layout{grid-template-columns:1fr;} }

  .rr-rounds{display:grid; gap:22px;}
  .rr-round-label{
    font-family:'JetBrains Mono',monospace;
    font-size:0.72rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .rr-round-matches{display:grid; gap:10px;}

  .standings-wrap{position:sticky; top:96px;}
  .standings-wrap h4{font-size:1rem; color:var(--ink); margin-bottom:14px;}
  table.standings td.rank-cell{
    font-family:'JetBrains Mono',monospace;
    color:var(--mint-dim);
    font-weight:600;
  }
  table.standings tr.leader td{background:var(--mint-soft);}

  .empty-note{
    text-align:center;
    color:var(--ink-soft);
    font-size:0.9rem;
    padding:30px;
    border:1.5px dashed var(--line-light);
    border-radius:14px;
  }

  /* ============ SCOREBOARD TAB ============ */
  #scoreboard.tab-panel.active{
    display:flex;
    flex-direction:column;
    height:calc(100vh - var(--nav-h, 64px));
    height:calc(100dvh - var(--nav-h, 64px));
  }
  .scoreboard-frame-wrap{
    flex:1;
    min-height:0;
    background:var(--bg-deeper);
  }

  /* =========================================================
     PADDLE CALL — scoreboard tab styles
     ========================================================= */

  #pcApp{
    --bg-deep:#0E3B42;
    --bg-deeper:#082A30;
    --bg-card:#123F47;
    --p1:#00F0C8;
    --p1-dim:#00B89C;
    --p2:#FFB020;
    --p2-dim:#D9930E;
    --ink:#F3FAF9;
    --ink-dim:rgba(243,250,249,0.62);
    --ink-faint:rgba(243,250,249,0.4);
    --line:rgba(255,255,255,0.14);
    --danger:#FF6B6B;
    --safe-t:env(safe-area-inset-top, 0px);
    --safe-b:env(safe-area-inset-bottom, 0px);
    --safe-l:env(safe-area-inset-left, 0px);
    --safe-r:env(safe-area-inset-right, 0px);
  }
  button{font-family:inherit; cursor:pointer;}
  input{font-family:inherit;}

  #pcApp{
    position:relative;
    height:100%;
    width:100%;
    overflow:hidden;
    background:var(--bg-deeper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-tap-highlight-color:transparent;
  }

  .screen{display:none; height:100%; width:100%; flex-direction:column;}
  .screen.active{display:flex;}

  /* ============ SETUP SCREEN ============ */
  #screen-setup{
    background:
      radial-gradient(circle at 85% -10%, rgba(0,240,200,0.14), transparent 45%),
      var(--bg-deep);
    overflow-y:auto;
    align-items:center;
    padding: calc(48px + var(--safe-t)) 20px calc(48px + var(--safe-b));
  }
  .pc-setup-card{
    width:100%;
    max-width:420px;
    text-align:center;
  }
  .eyebrow{
    display:inline-flex;
    font-family:'JetBrains Mono',monospace;
    font-size:0.72rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--p1);
    background:rgba(0,240,200,0.12);
    border:1px solid rgba(0,240,200,0.35);
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:18px;
  }
  .pc-title{
    font-size:clamp(2.2rem, 9vw, 3rem);
    color:var(--p1);
    text-transform:uppercase;
    letter-spacing:0.01em;
    line-height:1;
  }
  .tagline{
    color:var(--ink-dim);
    font-size:0.95rem;
    margin:10px 0 34px;
  }

  .pc-field-block{margin-bottom:22px; text-align:left;}
  .pc-field-block > label{
    display:block;
    font-family:'JetBrains Mono',monospace;
    font-size:0.7rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-bottom:8px;
  }
  .name-input{
    width:100%;
    padding:14px 16px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:rgba(255,255,255,0.05);
    color:var(--ink);
    font-size:1rem;
    outline:none;
    transition:border-color 0.2s ease;
  }
  .name-input:focus{border-color:var(--p1);}
  .name-input::placeholder{color:var(--ink-faint);}

  .segmented{
    display:flex;
    gap:6px;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--line);
    border-radius:12px;
    padding:5px;
  }
  .segmented button{
    flex:1;
    background:transparent;
    border:none;
    color:var(--ink-dim);
    font-weight:700;
    font-size:0.88rem;
    padding:11px 8px;
    border-radius:9px;
    transition:background 0.2s ease, color 0.2s ease;
  }
  .segmented button.active{
    background:var(--p1);
    color:var(--bg-deeper);
  }
  .segmented button:disabled{opacity:0.35; cursor:not-allowed;}

  .toggle-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .toggle-row > label{margin:0;}
  .toggle-switch{
    width:52px; height:30px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:rgba(255,255,255,0.06);
    position:relative;
    padding:0;
    transition:background 0.2s ease, border-color 0.2s ease;
  }
  .toggle-switch .knob{
    position:absolute;
    top:3px; left:3px;
    width:21px; height:21px;
    border-radius:50%;
    background:var(--ink-dim);
    transition:transform 0.2s ease, background 0.2s ease;
  }
  .toggle-switch.active{background:rgba(0,240,200,0.18); border-color:var(--p1);}
  .toggle-switch.active .knob{transform:translateX(22px); background:var(--p1);}
  .toggle-switch:disabled{opacity:0.35; cursor:not-allowed;}

  .voice-unsupported-note{
    font-size:0.82rem;
    line-height:1.5;
    color:var(--p2);
    background:rgba(255,176,32,0.1);
    border:1px solid rgba(255,176,32,0.3);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:22px;
  }

  .btn-start{
    width:100%;
    background:var(--p1);
    color:var(--bg-deeper);
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:1.05rem;
    padding:17px;
    border-radius:14px;
    box-shadow:0 14px 30px rgba(0,240,200,0.22);
    margin-top:10px;
  }

  /* ============ MATCH SCREEN ============ */
  #screen-match{ background:var(--bg-deeper); position:relative; }

  .topbar{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    padding: calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));
    flex:0 0 auto;
    z-index:20;
    background:var(--bg-deeper);
  }
  .topbar-left, .topbar-right{display:flex; gap:8px; flex:0 0 auto;}
  .icon-btn{
    width:38px; height:38px;
    border-radius:50%;
    border:1.5px solid var(--line);
    background:rgba(255,255,255,0.04);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-size:1.05rem;
    flex:0 0 auto;
  }
  .icon-btn:active{background:rgba(255,255,255,0.1);}
  .icon-btn.danger-hover:active{color:var(--danger); border-color:var(--danger);}

  .topbar-center{flex:1 1 auto; text-align:center; min-width:0; padding-top:2px;}
  .vs-row{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:0.92rem;
    letter-spacing:0.01em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .vs-row .vs-name.p1{color:var(--p1);}
  .vs-row .vs-name.p2{color:var(--p2);}
  .vs-row .vs-sep{color:var(--ink-faint); margin:0 6px; font-weight:500; font-size:0.78rem;}

  .game-label{
    font-family:'JetBrains Mono',monospace;
    font-size:0.68rem;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-top:3px;
  }
  .game-label.deuce{
    color:var(--p2);
    animation:deucePulse 1.4s ease-in-out infinite;
  }
  @keyframes deucePulse{0%,100%{opacity:1;}50%{opacity:0.45;}}

  .tally-row{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:0.82rem;
    margin-top:4px;
  }
  .tally-row .tp1{color:var(--p1);}
  .tally-row .tp2{color:var(--p2);}
  .tally-row .tsep{color:var(--ink-faint); margin:0 6px;}

  .listening-pill{
    position:absolute;
    top: calc(72px + var(--safe-t));
    left:50%;
    transform:translateX(-50%);
    display:flex; align-items:center; gap:7px;
    background:rgba(255,176,32,0.15);
    border:1px solid rgba(255,176,32,0.5);
    color:var(--p2);
    font-family:'JetBrains Mono',monospace;
    font-size:0.7rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:6px 13px;
    border-radius:999px;
    z-index:25;
  }
  .dot-pulse{
    width:7px; height:7px; border-radius:50%; background:var(--p2);
    animation:dotPulse 1.2s ease-in-out infinite;
  }
  @keyframes dotPulse{0%,100%{opacity:1; transform:scale(1);}50%{opacity:0.4; transform:scale(0.7);}}

  /* ---- court ---- */
  .court{
    flex:1 1 auto;
    display:flex;
    flex-direction:row;
    min-height:0;
    position:relative;
  }
  @media (orientation:portrait){
    .court{flex-direction:column;}
  }

  .half{
    flex:1 1 0;
    min-width:0; min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
    padding: 10px 14px calc(10px + var(--safe-b));
    outline:none;
    overflow:hidden;
  }
  .half-p1{padding-left: calc(14px + var(--safe-l));}
  .half-p2{padding-right: calc(14px + var(--safe-r));}
  @media (orientation:portrait){
    .half-p1{padding-left:14px;}
    .half-p2{padding-right:14px;}
  }
  .half:focus-visible{box-shadow:inset 0 0 0 3px rgba(255,255,255,0.4);}

  .name-row{
    flex:0 0 auto;
    display:flex; align-items:center; gap:8px;
    padding-top:2px;
  }
  .serve-dot{
    width:9px; height:9px; border-radius:50%;
    background:currentColor;
    opacity:0.15;
    transition:opacity 0.2s ease;
  }
  .serve-dot.active{opacity:1; box-shadow:0 0 9px currentColor;}
  .player-name{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    text-transform:uppercase;
    font-size:clamp(0.85rem, 3vw, 1.15rem);
    letter-spacing:0.02em;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .half-p1 .player-name, .half-p1 .serve-dot{color:var(--p1);}
  .half-p2 .player-name, .half-p2 .serve-dot{color:var(--p2);}

  .score-wrapper{
    flex:1;
    min-height:0;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .score-digit{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:clamp(72px, 26vw, 170px);
    line-height:1;
    color:var(--ink);
    transform:scale(1);
  }
  .score-digit.bump{animation:scoreBump 0.35s ease;}
  @keyframes scoreBump{0%{transform:scale(1);}40%{transform:scale(1.18);}100%{transform:scale(1);}}

  .games-label{
    flex:0 0 auto;
    font-family:'JetBrains Mono',monospace;
    font-size:0.72rem;
    letter-spacing:0.1em;
    color:var(--ink-dim);
    margin-bottom:2px;
  }
  .tap-hint{
    flex:0 0 auto;
    font-size:0.72rem;
    color:var(--ink-faint);
  }

  .glow{
    position:absolute; inset:0;
    pointer-events:none;
    opacity:0;
    z-index:1;
  }
  .half-p1 .glow{background:radial-gradient(circle at center, var(--p1), transparent 70%);}
  .half-p2 .glow{background:radial-gradient(circle at center, var(--p2), transparent 70%);}
  .glow.flash{animation:glowFlash 0.5s ease-out;}
  @keyframes glowFlash{0%{opacity:0.5;}100%{opacity:0;}}

  .name-row, .score-wrapper, .games-label, .tap-hint{position:relative; z-index:2;}

  .net-bar{
    flex:0 0 auto;
    width:3px;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.18) 0 4px, transparent 4px 9px);
    position:relative;
  }
  @media (orientation:portrait){
    .net-bar{width:100%; height:3px;
      background:repeating-linear-gradient(-45deg, rgba(255,255,255,0.18) 0 4px, transparent 4px 9px);
    }
  }

  .ball{
    position:fixed;
    left:50%; top:50%;
    width:14px; height:14px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 10px rgba(255,255,255,0.85), 0 0 2px #fff;
    pointer-events:none;
    z-index:40;
    opacity:0;
    transform:translate(-50%,-50%);
  }
  .ball.fly-left{animation:ballFlyLeft 0.6s ease-out forwards;}
  .ball.fly-right{animation:ballFlyRight 0.6s ease-out forwards;}
  @keyframes ballFlyLeft{
    0%{opacity:1; transform:translate(-50%,-50%) scale(1);}
    50%{opacity:1; transform:translate(-120%,-90%) scale(1.3);}
    100%{opacity:0; transform:translate(-220%,-40%) scale(1.6);}
  }
  @keyframes ballFlyRight{
    0%{opacity:1; transform:translate(-50%,-50%) scale(1);}
    50%{opacity:1; transform:translate(20%,-90%) scale(1.3);}
    100%{opacity:0; transform:translate(120%,-40%) scale(1.6);}
  }
  @media (orientation:portrait){
    @keyframes ballFlyLeft{
      0%{opacity:1; transform:translate(-50%,-50%) scale(1);}
      50%{opacity:1; transform:translate(-90%,-120%) scale(1.3);}
      100%{opacity:0; transform:translate(-40%,-220%) scale(1.6);}
    }
    @keyframes ballFlyRight{
      0%{opacity:1; transform:translate(-50%,-50%) scale(1);}
      50%{opacity:1; transform:translate(-90%,20%) scale(1.3);}
      100%{opacity:0; transform:translate(-40%,120%) scale(1.6);}
    }
  }

  /* short viewport shrink */
  @media (max-height:640px){
    .player-name{font-size:clamp(0.72rem, 2.6vw, 0.95rem);}
    .score-digit{font-size:clamp(52px, 20vw, 110px);}
    .games-label, .tap-hint{font-size:0.64rem;}
    .name-row{gap:6px;}
  }

  /* ---- bottom dock ---- */
  .bottom-dock{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    padding: 8px calc(16px + var(--safe-r)) calc(14px + var(--safe-b)) calc(16px + var(--safe-l));
    background:var(--bg-deeper);
    border-top:1px solid var(--line);
    z-index:20;
  }
  .ticker{
    font-family:'JetBrains Mono',monospace;
    font-size:0.72rem;
    color:var(--ink-faint);
    text-align:center;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    min-height:1.2em;
  }
  .ticker .tick-ok{color:var(--p2); font-weight:600;}
  .ticker .tick-no{color:var(--ink-faint);}

  .dock-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
  }
  .dock-btn{
    width:46px; height:46px;
    border-radius:50%;

    background:rgba(255,255,255,0.04);
    color:var(--ink);
    font-size:1.15rem;
    display:flex; align-items:center; justify-content:center;
  }
  .dock-btn:disabled{opacity:0.3;}
  .mic-btn{
    width:66px; height:66px;
    border-radius:50%;
    border:none;
    background:var(--bg-card);
    border:2px solid var(--line);
    color:var(--ink-dim);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    flex:0 0 auto;
  }
  .mic-btn svg{width:26px; height:26px;}
  .mic-btn.listening{
    background:var(--p2);
    border-color:var(--p2);
    color:var(--bg-deeper);
  }
  .mic-btn.listening::before{
    content:"";
    position:absolute;
    inset:-8px;
    border-radius:50%;
    border:2px solid var(--p2);
    animation:micPulse 1.4s ease-out infinite;
  }
  @keyframes micPulse{
    0%{transform:scale(0.9); opacity:0.8;}
    100%{transform:scale(1.35); opacity:0;}
  }
  .mic-btn:disabled{opacity:0.3;}

  /* ============ OVERLAYS ============ */
  .overlay{
    position:fixed; inset:0;
    background:rgba(5,20,23,0.86);
    backdrop-filter:blur(3px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:24px calc(24px + var(--safe-r)) calc(24px + var(--safe-b)) calc(24px + var(--safe-l));
  }
  .overlay.show{display:flex;}
  .overlay-card{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:22px;
    padding:34px 28px;
    max-width:420px;
    width:100%;
    max-height:88vh;
    overflow-y:auto;
    text-align:center;
  }
  .overlay-eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:0.72rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--p1);
    margin-bottom:10px;
    display:block;
  }
  .overlay-card h2{
    font-size:1.6rem;
    color:var(--ink);
    margin-bottom:10px;
  }
  .overlay-card .final-score{
    font-family:'JetBrains Mono',monospace;
    font-size:2.2rem;
    font-weight:700;
    color:var(--p1);
    margin:14px 0;
  }
  .overlay-btn{
    width:100%;
    background:var(--p1);
    color:var(--bg-deeper);
    border:none;
    font-weight:700;
    font-size:1rem;
    padding:15px;
    border-radius:12px;
    margin-top:18px;
  }
  .overlay-btn.secondary{
    background:transparent;
    border:1.5px solid var(--line);
    color:var(--ink);
  }
  .games-recap{
    text-align:left;
    margin-top:20px;
    border-top:1px solid var(--line);
    padding-top:16px;
  }
  .games-recap-title{
    font-family:'JetBrains Mono',monospace;
    font-size:0.68rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-bottom:10px;
  }
  .games-recap-list{list-style:none; margin:0; padding:0; display:grid; gap:8px; max-height:180px; overflow-y:auto;}
  .games-recap-list li{
    display:flex; justify-content:space-between;
    font-size:0.88rem;
    background:rgba(255,255,255,0.04);
    border-radius:8px;
    padding:9px 12px;
  }
  .games-recap-list .g-winner{font-weight:700;}

  /* settings overlay specific */
  .settings-section{text-align:left; margin-bottom:22px;}
  .settings-section h3{font-size:0.95rem; color:var(--ink); margin-bottom:14px;}

  @media (prefers-reduced-motion: reduce){
    .ball{display:none !important;}
    .score-digit.bump, .glow.flash, .mic-btn.listening::before, .dot-pulse, .game-label.deuce{
      animation:none !important;
    }
    .pc-ball, .pc-ball-shadow, .pc-paddle-left, .pc-paddle-right{
      animation:none !important;
    }
    .hero-ball, .hero-ball-shadow{
      animation:none !important;
    }
    .pc-ball{left:50%; top:35%;}
    .pc-ball-shadow{left:50%; opacity:0.2;}
    .pc-paddle-left{left:3%;}
    .pc-paddle-right{right:3%;}
  }

  /* ============ MARKETPLACE TAB ============ */
  .mkt-wrap{
    max-width:1080px;
    margin:0 auto;
    padding:24px 24px 110px;
  }
  .mkt-toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    margin-bottom:28px;
  }
  .mkt-toolbar .text-input{width:auto;}
  #mkt-city-filter{flex:1; min-width:150px;}
  .mkt-spacer{flex-grow:1;}
  .btn-create-listing{
    display:inline-flex;

    gap:8px;
    background:var(--mint);

  }

    border-radius:18px;

  .mkt-card-event{
    background:#FCF7F8;
    border-color:#F6D3E4;
  }
  .mkt-card-sponsored{

  }
  .mkt-card-recommended{
    background:#EAF6EE;
    border-color:#BFE3CC;
  }
  .mkt-card-dimmed::after{
    content:'';

    inset:0;
    background:rgba(30,38,40,0.13);

  }
  .mkt-share-btn{
    position:absolute;
    right:14px;
    bottom:14px;

    align-items:center;
    justify-content:center;

  .mkt-share-btn svg{width:14px;height:14px;flex-shrink:0;}
  .mkt-card-highlight{

  }
  @keyframes mktHighlightPulse{

  .mkt-share-menu{

    font-weight:700;
    font-size:0.62rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:999px;
  }
  .mkt-boosted-tag{
    display:inline-flex;
    align-items:center;
    gap:4px;
    background:#E9E9E9;
    color:#7A7A7A;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:0.62rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:4px 10px;

  .mkt-event-tag{

  function compressImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const u = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(u);
        const k = Math.min(1, maxDim / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * k));
        c.height = Math.max(1, Math.round(img.height * k));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(b => b ? resolve(b) : reject(new Error('compression failed')), 'image/jpeg', quality);
      };
      img.onerror = () => { URL.revokeObjectURL(u); reject(new Error('could not read image')); };
      img.src = u;
    });
  }

  async function uploadImage(file) {

    const put = async (blob, p) => {
      const res = await fetch(`${SUPABASE_URL}/storage/v1/object/listing-images/${p}`, { method: 'POST', headers: headers({ 'Content-Type': 'image/jpeg' }), body: blob });
      if (!res.ok) throw new Error(await res.text());
    };
    await put(full, path);
    await put(thumb, `sm-${path}`);
    return `${SUPABASE_URL}/storage/v1/object/public/listing-images/${path}`;
  }

    if (h) return h;

    if (d && !isNaN(d)) return d;
    return new Date(b.created_at) - new Date(a.created_at);
  };

  async function saveOrder(draggedId, targetId) {
    const view = getFiltered().map(p => String(p.id));
    const from = view.indexOf(draggedId), to = view.indexOf(targetId);
    if (from < 0 || to < 0 || from === to) return;
    view.splice(to, 0, view.splice(from, 1)[0]);
    const all = products.slice().sort(orderCmp);
    const inView = new Set(view);
    let k = 0;
    const next = all.map(p => inView.has(String(p.id)) ? products.find(x => String(x.id) === view[k++]) : p);
    const changed = [];
    next.forEach((p, i) => { const v = (i + 1) * 10; if (p.sort_order !== v) { changed.push([p, v]); } });
    const prev = changed.map(([p]) => p.sort_order);
    changed.forEach(([p, v]) => { p.sort_order = v; });
    render();
    try {
      await Promise.all(changed.map(([p, v]) => fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${p.id}`, {
        method: 'PATCH',
        headers: headers({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
        body: JSON.stringify({ sort_order: v })
      }).then(r => { if (!r.ok) throw new Error('save failed'); })));
      toast('Order saved');
    } catch (e) {
      changed.forEach(([p], i) => { p.sort_order = prev[i]; });
      render();
      toast('Could not save order');
    }
  }

  }

      const title = $('st-f-title').value.trim();
      const price = $('st-f-price').value;
      const files = [0, 1, 2].map(i => $('st-f-img' + i).files[0] || null);
      const picked = files.filter(Boolean);
      if (!title || price === '') { err.textContent = 'Please add a product name and price.'; return; }
      if (picked.some(f => /heic|heif/i.test(f.type) || /\.(heic|heif)$/i.test(f.name))) { err.textContent = 'HEIC photos are not supported. Please use JPG, PNG or WebP.'; return; }
      if (picked.some(f => f.size > 3 * 1024 * 1024)) { err.textContent = 'Each photo must be 3MB or smaller.'; return; }
      const btn = $('st-f-submit');
      const label = btn.textContent;
      btn.disabled = true; btn.textContent = 'Saving…'; err.textContent = '';
      try {
        const urls = [];
        for (let i = 0; i < 3; i++) {
          if (files[i]) urls.push(await uploadImage(files[i]));
          else if (keep[i]) urls.push(keep[i]);
        }
        const data = {
          title, price: Number(price), currency: $('st-f-cur').value,
          category: $('st-f-cat').value, brand: $('st-f-brand').value,
          seller_name: $('st-f-seller').value.trim() || STORE_NAME,
          seller_contact: $('st-f-contact').value.trim() || ORDER_CONTACT,
          description: $('st-f-desc').value.trim() || null,
          image_url: urls.length ? urls : null
        };
        if (edit) {
          const row = await patchProduct(p.id, data);
          Object.assign(p, row);
          b.remove(); toast('Product updated'); render();
        } else {
          await postProduct(Object.assign(data, { condition: 'new', status: 'Available' }));
          b.remove(); toast('Product added'); await fetchProducts();
        }
      } catch (e) {
        console.error('Store: failed to save product', e);
        err.textContent = 'Could not save: ' + (e.message || 'unknown error');
        btn.disabled = false; btn.textContent = label;
      }
    };
  }

  const ownerBtn = document.getElementById('stOwnerBtn');
  if (ownerBtn) ownerBtn.onclick = openOwnerAccess;
  if (location.hash === '#owner') openOwnerAccess();
  fetchProducts();
})();
</script>
</body>
</html>
